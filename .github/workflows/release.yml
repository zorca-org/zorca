name: release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: dev
        type: choice
        options:
          - dev
          - nightly
          - stable
      platform:
        description: Platform to build
        required: true
        default: macos
        type: choice
        options:
          - macos
          - linux
          - windows
          - all
      publish:
        description: Publish artifacts as a GitHub release
        required: true
        default: false
        type: boolean
      tag:
        description: Stable tag, for example v1.14.0
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.channel }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        env:
          CHANNEL: ${{ inputs.channel }}
          PUBLISH: ${{ inputs.publish }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == "true" && "$CHANNEL" == "dev" ]]; then
            echo "Dev builds cannot be published" >&2
            exit 1
          fi
          if [[ "$PUBLISH" == "true" && "$CHANNEL" == "stable" && ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable publishing requires a vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          if [[ "$CHANNEL" == "nightly" && -z "$TAG" ]]; then
            TAG="nightly-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    if: inputs.platform == 'macos' || inputs.platform == 'all'
    runs-on: macos-15
    timeout-minutes: 180
    env:
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
      APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
      APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Select release channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: printf '%s\n' "$CHANNEL" > crates/zed/RELEASE_CHANNEL
      - name: Require signing for public channels
        if: inputs.channel != 'dev'
        run: |
          test -n "$MACOS_SIGNING_IDENTITY"
          test -n "$MACOS_CERTIFICATE"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          test -n "$APPLE_NOTARIZATION_KEY"
          test -n "$APPLE_NOTARIZATION_KEY_ID"
          test -n "$APPLE_NOTARIZATION_ISSUER_ID"
      - name: Build macOS package
        run: ./script/bundle-mac aarch64-apple-darwin
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zorca-${{ inputs.channel }}-macos-aarch64
          path: |
            target/aarch64-apple-darwin/release/ZOrca-aarch64.dmg
            target/zorca-remote-server-macos-aarch64.gz
          if-no-files-found: error
          retention-days: 7

  linux:
    needs: prepare
    if: inputs.platform == 'linux' || inputs.platform == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Select release channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: printf '%s\n' "$CHANNEL" > crates/zed/RELEASE_CHANNEL
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install WASI SDK
        run: ./script/download-wasi-sdk
      - name: Build Linux package
        run: ./script/bundle-linux
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zorca-${{ inputs.channel }}-linux-x86_64
          path: |
            target/release/zorca-linux-x86_64.tar.gz
            target/zorca-remote-server-linux-x86_64.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: prepare
    if: inputs.platform == 'windows' || inputs.platform == 'all'
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      ZED_WORKSPACE: ${{ github.workspace }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
      ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
      CERT_PROFILE_NAME: ${{ vars.AZURE_SIGNING_CERT_PROFILE_NAME }}
      ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      FILE_DIGEST: SHA256
      TIMESTAMP_DIGEST: SHA256
      TIMESTAMP_SERVER: http://timestamp.acs.microsoft.com
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Select release channel
        shell: pwsh
        env:
          CHANNEL: ${{ inputs.channel }}
        run: Set-Content -Path crates/zed/RELEASE_CHANNEL -Value $env:CHANNEL
      - name: Require signing for published builds
        if: inputs.publish
        shell: pwsh
        run: |
          $required = @(
            'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET',
            'ACCOUNT_NAME', 'CERT_PROFILE_NAME', 'ENDPOINT'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            throw "Missing Windows signing configuration: $($missing -join ', ')"
          }
      - name: Build Windows package
        shell: pwsh
        run: ./script/bundle-windows.ps1 -Architecture x86_64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zorca-${{ inputs.channel }}-windows-x86_64
          path: |
            target/ZOrca-*.exe
            target/zorca-remote-server-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - prepare
      - macos
      - linux
      - windows
    if: always() && inputs.publish && needs.prepare.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: zorca-${{ inputs.channel }}-*
          path: release-artifacts
          merge-multiple: true
      - name: Create checksums
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS
      - name: Publish GitHub release
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
          prerelease=()
          if [[ "$CHANNEL" == "nightly" ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" release-artifacts/* \
            --title "ZOrca ${TAG#v}" \
            --generate-notes \
            "${prerelease[@]}"
