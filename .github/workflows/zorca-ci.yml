name: zorca-ci

on:
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: Publish this build as the rolling nightly release
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: zorca-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_LTO: "false"

jobs:
  linux:
    runs-on: [self-hosted, zorca, Linux, X64]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false
          persist-credentials: false
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install WASI SDK
        run: ./script/download-wasi-sdk
      - name: Select release channel
        env:
          CHANNEL: ${{ (github.event_name == 'schedule' || inputs.publish_nightly) && 'nightly' || 'dev' }}
        run: printf '%s\n' "$CHANNEL" > crates/zed/RELEASE_CHANNEL
      - name: Build Linux package
        run: ./script/bundle-linux
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zorca-linux-x86_64
          path: |
            target/release/zorca-linux-x86_64.tar.gz
            target/zorca-remote-server-linux-x86_64.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: [self-hosted, zorca, Windows, X64]
    timeout-minutes: 120
    env:
      CARGO_HOME: C:\Rust\cargo
      RUSTUP_HOME: C:\Rust\rustup
      ZED_WORKSPACE: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          clean: false
          persist-credentials: false
      - name: Install MSVC Rust target
        run: |
          "C:\Rust\cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\BuildTools\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          C:\Rust\cargo\bin\rustup.exe target add x86_64-pc-windows-msvc
      - name: Select release channel
        env:
          CHANNEL: ${{ (github.event_name == 'schedule' || inputs.publish_nightly) && 'nightly' || 'dev' }}
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "crates/zed/RELEASE_CHANNEL"
          [System.IO.File]::WriteAllText($path, "$env:CHANNEL`n")
      - name: Build Windows package
        run: ./script/bundle-windows.ps1 -Architecture x86_64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zorca-windows-x86_64
          path: |
            target/ZOrca-*.exe
            target/zorca-remote-server-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  nightly:
    needs: [linux, windows]
    if: github.event_name == 'schedule' || inputs.publish_nightly
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: zorca-*-x86_64
          path: nightly
          merge-multiple: true
      - name: Prepare nightly assets
        run: |
          find nightly -mindepth 2 -type f -exec mv -t nightly {} +
          find nightly -mindepth 1 -type d -empty -delete
          cd nightly
          sha256sum * > SHA256SUMS
      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly nightly/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ZOrca Nightly $(date -u +%Y-%m-%d)" \
            --notes "Automated Linux and Windows build from $GITHUB_SHA." \
            --prerelease
