[package]
name = "ade_workspaces"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/ade_workspaces.rs"
doctest = false

[features]
test-support = ["db/test-support"]

[dependencies]
ade_session.workspace = true
anyhow.workspace = true
db.workspace = true
editor.workspace = true
gpui.workspace = true
log.workspace = true
menu.workspace = true
project.workspace = true
remote.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
task.workspace = true
terminal.workspace = true
terminal_view.workspace = true
time.workspace = true
ui.workspace = true
util.workspace = true
workspace.workspace = true

[dev-dependencies]
# The daemon's library half, so the backend can be tested against a real daemon
# in-process. Nothing outside `#[cfg(test)]` depends on it.
ade_session_daemon.workspace = true
db = { workspace = true, features = ["test-support"] }
# A real window over a real project, so the layout translation is tested against
# Zed's own pane tree rather than against a description of it.
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
# For `insert_test_center_terminal`: a display-only terminal, since a real pty
# is not deterministic under the test scheduler.
terminal_view = { workspace = true, features = ["test-support"] }
theme.workspace = true
theme_settings.workspace = true
workspace = { workspace = true, features = ["test-support"] }
